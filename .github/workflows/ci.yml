name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS minutes are billed (10x) on private repositories; CI starts once the repository is public.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use the newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # The same make targets contributors run, so the documented setup is what CI checks.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test the Swift packages
        run: make test
      - name: Build the universal app (ad-hoc signed)
        run: |
          make build CONFIGURATION=Release \
            XCODEBUILD_FLAGS="-destination 'generic/platform=macOS' ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER="
      - name: Verify universal binaries
        run: |
          app="build/Build/Products/Release/MacHelper.app"
          for bin in \
            "$app/Contents/MacOS/MacHelper" \
            "$app/Contents/MacOS/MacHelperHelper" \
            "$app/Contents/MacOS/machelper-cli" \
            "$app/Contents/PlugIns/FinderExtension.appex/Contents/MacOS/FinderExtension" \
            "$app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle"; do
            archs="$(lipo -archs "$bin")"
            echo "$(basename "$bin"): $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]]
          done
      - name: Show the build log
        if: failure()
        run: tail -60 build/xcodebuild-Release.log || true
