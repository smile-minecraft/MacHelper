name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode on the runner
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Test the Swift packages
        run: swift test
      - name: Build the app (ad-hoc signed)
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project MacHelper.xcodeproj -scheme MacHelper -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build | tail -20
